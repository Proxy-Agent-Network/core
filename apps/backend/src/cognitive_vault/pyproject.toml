[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-vault"
version = "0.1.0"
description = "PAN Proxy-Alpha Cognitive Security & Emotion Engine"
authors = [
    {name = "PAN Engineering"}
]
requires-python = ">=3.10"
dependencies = [
    # 🟢 THE FIX: Enforcing the cryptography dependency for memory_cipher.py
    "cryptography>=41.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]